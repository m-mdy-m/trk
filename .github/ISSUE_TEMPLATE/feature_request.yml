name: Feature Request
description: Suggest a feature for TRK
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
      placeholder: I need to track multiple projects at once...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work?
      placeholder: Add a 'trk switch' command that...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve this
      placeholder: I could manually stop/start, but...

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else relevant